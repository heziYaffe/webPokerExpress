# Move this file to .github/workflows/ci.yml to enable CI.
name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
